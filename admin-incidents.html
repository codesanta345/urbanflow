<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Incident Reports | Urban Flow Admin</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .admin-action-btn {
      padding: 8px 14px;
      border: none;
      border-radius: var(--radius-sm);
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .admin-action-btn.success { background: #10B981; color: white; }
    .admin-action-btn.danger { background: #EF4444; color: white; }
    .admin-action-btn:hover { opacity: 0.9; }

    .incident-admin-item {
      background: #18192A;
      border: 1px solid rgba(255,255,255,0.08);
      padding: 14px;
      border-radius: var(--radius-sm);
      margin-bottom: 10px;
    }
    .severity-pill {
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
    }
    .severity-pill.critical { background: rgba(220, 38, 38, 0.2); color: #FCA5A5; border: 1px solid rgba(220, 38, 38, 0.4); }
    .severity-pill.major { background: rgba(234, 88, 12, 0.2); color: #FDBA74; border: 1px solid rgba(234, 88, 12, 0.4); }
    .severity-pill.minor { background: rgba(100, 116, 139, 0.2); color: #CBD5E1; border: 1px solid rgba(100, 116, 139, 0.4); }

    /* Modal Styling */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      z-index: 9999;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-backdrop.open {
      display: flex;
    }
    .admin-modal {
      background: #141524;
      color: #fff;
      width: 100%;
      max-width: 500px;
      border-radius: var(--radius-md);
      padding: 24px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255,255,255,0.1);
    }
    
    .db-status-bar {
      background: #18192A;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: var(--radius-sm);
      padding: 12px 16px;
      margin-top: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .db-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 600;
      color: #F8FAFC;
    }
    .pulse-dot {
      width: 8px;
      height: 8px;
      background: #10B981;
      border-radius: 50%;
      box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }
    
    .input-group input, .input-group select, .input-group textarea {
      background: #0B0C10 !important;
      color: #fff !important;
      border: 1px solid rgba(255,255,255,0.2) !important;
    }
  </style>
</head>
<body class="dash-page">

  <!-- ===== TOP NAV BAR ===== -->
  <nav class="dash-nav">
    <a href="admin.html" class="nav-logo-link">
      <i class="fa-solid fa-arrow-left"></i> Hub
    </a>
    <span class="nav-pill-role" style="background: rgba(37, 99, 235, 0.1); border: 1px solid rgba(37, 99, 235, 0.3); color:#2563EB;">
      Incident Management
    </span>

    <div class="spacer"></div>

    <div class="dash-nav-links">
      <div class="user-menu-wrap">
        <button type="button" class="user-badge user-menu-trigger" onclick="toggleUserMenu(event)">
          <div class="avatar-circle" id="navUserAvatar" style="background:#2563EB;">A</div>
          <span id="navUserName">Admin</span>
          <i class="fa-solid fa-chevron-down user-menu-caret"></i>
        </button>
        <div class="user-menu-dropdown">
          <div class="user-menu-mode" id="navUserModeLabel">Administrator Mode</div>
          <div class="user-menu-divider"></div>
          <button type="button" class="user-menu-logout" onclick="UrbanFlowData.logout()">
            <i class="fa-solid fa-right-from-bracket"></i> Log Out
          </button>
        </div>
      </div>
    </div>
  </nav>

  <main class="hub-main" style="max-width: 900px; margin: 0 auto;">
    <div class="hub-welcome">
      <div>
        <h1>Live Incident Reports</h1>
        <p>Review, verify, and resolve traffic incidents reported across the city.</p>
      </div>
      <div>
        <button onclick="fetchIncidentsFromDB()" class="admin-action-btn" style="background:#4F46E5; color: white;">
          <i class="fa-solid fa-rotate"></i> Refresh MongoDB Sync
        </button>
      </div>
    </div>

    <!-- MongoDB Live Status Banner -->
    <div class="db-status-bar">
      <div style="display:flex; align-items:center; gap:12px;">
        <span class="db-badge" id="dbStatusBadge">
          <span class="pulse-dot"></span>
          <span id="dbStatusText">MongoDB Atlas: Connected</span>
        </span>
        <span style="font-size: 13px; color: #94A3B8;">Collection: <code>urbanflow.incidents</code></span>
      </div>
    </div>

    <!-- Active Incidents List -->
    <div class="admin-card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
        <h3 style="margin:0;">
          <span><i class="fa-solid fa-triangle-exclamation" style="color: #EF4444;"></i> Database Incidents</span>
        </h3>
        <button onclick="openAddIncidentModal()" class="admin-action-btn success">
          <i class="fa-solid fa-plus"></i> Add Fake/Test Incident
        </button>
      </div>

      <div id="adminIncidentsContainer" style="display:flex; flex-direction:column; gap:10px; max-height: 600px; overflow-y:auto; padding-right:4px;">
        <div style="text-align:center; padding:20px; color:#64748B;">
          <i class="fa-solid fa-spinner fa-spin"></i> Fetching incidents from MongoDB...
        </div>
      </div>
    </div>
  </main>

  <!-- ADD INCIDENT MODAL -->
  <div class="modal-backdrop" id="addIncidentModal">
    <div class="admin-modal">
      <h3 style="margin-top:0; border-bottom:1px solid #E2E8F0; padding-bottom:10px; margin-bottom:16px;">
        <i class="fa-solid fa-triangle-exclamation" style="color:#EF4444;"></i> Broadcast New Incident
      </h3>
      <form id="adminNewIncidentForm">
        <div class="input-group" style="margin-bottom:12px;">
          <label style="display:block; font-weight:600; margin-bottom:4px;">Incident Type</label>
          <select id="modalIncType" style="width:100%; padding:10px; border-radius:6px; border:1px solid #CBD5E1;">
            <option value="Vehicle Accident">Vehicle Accident</option>
            <option value="Road Closure">Road Closure</option>
            <option value="Traffic Signal Failure">Traffic Signal Failure</option>
          </select>
        </div>
        <div class="input-group" style="margin-bottom:12px;">
          <label style="display:block; font-weight:600; margin-bottom:4px;">Location / Road Name</label>
          <input type="text" id="modalIncRoad" placeholder="e.g. Bypass Junction" required style="width:100%; padding:10px; border-radius:6px; border:1px solid #CBD5E1;">
        </div>
        <div class="input-group" style="margin-bottom:12px;">
          <label style="display:block; font-weight:600; margin-bottom:4px;">Severity Level</label>
          <select id="modalIncSeverity" style="width:100%; padding:10px; border-radius:6px; border:1px solid #CBD5E1;">
            <option value="Minor">Minor Delay</option>
            <option value="Major">Major Delay</option>
            <option value="Critical">Critical (Road Blocked)</option>
          </select>
        </div>
        <div class="input-group" style="margin-bottom:16px;">
          <label style="display:block; font-weight:600; margin-bottom:4px;">Description</label>
          <textarea id="modalIncDesc" rows="3" placeholder="Provide details..." style="width:100%; padding:10px; border-radius:6px; border:1px solid #CBD5E1;" required></textarea>
        </div>
        <div style="display:flex; justify-content:flex-end; gap:8px;">
          <button type="button" onclick="closeModals()" class="admin-action-btn" style="background:#64748B;">Cancel</button>
          <button type="submit" class="admin-action-btn success"><i class="fa-solid fa-satellite-dish"></i> Broadcast</button>
        </div>
      </form>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="script.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      fetchIncidentsFromDB();
      setupModalListeners();
    });

    let liveIncidents = [];

    function setDBStatus(isLive, text) {
      document.getElementById('dbStatusText').textContent = text;
      const badge = document.getElementById('dbStatusBadge');
      if (!isLive) {
        badge.querySelector('.pulse-dot').style.background = '#F59E0B'; // yellow/warning for local
      } else {
        badge.querySelector('.pulse-dot').style.background = '#10B981';
      }
    }

    async function fetchIncidentsFromDB() {
      const container = document.getElementById('adminIncidentsContainer');
      container.innerHTML = '<div style="text-align:center; padding:20px; color:#64748B;"><i class="fa-solid fa-spinner fa-spin"></i> Fetching incidents...</div>';
      
      try {
        const res = await fetch('/api/incidents');
        if (!res.ok) throw new Error('API offline or 404');
        const json = await res.json();
        if (json.success && Array.isArray(json.data)) {
          liveIncidents = json.data;
          setDBStatus(true, 'MongoDB Atlas: Connected (Live Synchronized)');
        } else {
          throw new Error(json.error || 'Failed to parse');
        }
      } catch (err) {
        console.warn('Falling back to local data store:', err);
        liveIncidents = window.UrbanFlowData.getIncidents();
        setDBStatus(false, 'Local Backup Active (API Offline)');
      }
      renderIncidents(liveIncidents);
    }

    function renderIncidents(incidents) {
      const container = document.getElementById('adminIncidentsContainer');
      if (!incidents || incidents.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding:20px; color:#64748B;">No active incidents reported. All roads clear!</div>';
        return;
      }

      container.innerHTML = '';
      incidents.forEach(inc => {
        const id = inc._id || inc.id;
        const sevClass = (inc.severity || 'minor').toLowerCase();
        const item = document.createElement('div');
        item.className = 'incident-admin-item';
        item.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:flex-start;">
            <div>
              <strong style="font-size:14px;">${escapeHtml(inc.title || inc.type)}</strong>
              <div style="font-size:12px; color:#475569; margin-top:2px;">
                <i class="fa-solid fa-location-dot" style="color:#EF4444;"></i> ${escapeHtml(inc.road || 'City Corridor')} &bull; 
                <span style="color:#64748B;">Reported by: ${escapeHtml(inc.reportedBy || 'User')}</span>
              </div>
              <div style="font-size:12px; color:#64748B; margin-top:4px;">${escapeHtml(inc.description || 'No additional notes.')}</div>
            </div>
            <span class="severity-pill ${sevClass}">${escapeHtml(inc.severity || 'Minor')}</span>
          </div>

          <div style="display:flex; justify-content:space-between; align-items:center; margin-top:8px; padding-top:8px; border-top:1px dashed #E2E8F0;">
            <span style="font-size:11px; font-weight:600; color:${inc.status === 'Verified' ? '#059669' : '#D97706'};">
              • ${escapeHtml(inc.status || 'Reported')}
            </span>
            <div class="incident-action-group">
              ${inc.status !== 'Verified' ? `<button onclick="verifyIncident('${id}')" class="admin-action-btn success" style="padding:4px 8px; font-size:11px;"><i class="fa-solid fa-check"></i> Verify</button>` : ''}
              <button onclick="resolveIncident('${id}')" class="admin-action-btn danger" style="padding:4px 8px; font-size:11px;"><i class="fa-solid fa-trash"></i> Delete / Resolve</button>
            </div>
          </div>
        `;
        container.appendChild(item);
      });
    }

    async function verifyIncident(id) {
      try {
        await fetch(`/api/incidents?id=${encodeURIComponent(id)}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status: 'Verified' })
        });
        showToast('Verified', 'Incident marked as verified in MongoDB.');
      } catch (err) {
        showToast('Notice', 'Incident verified in local session only.');
      }
      fetchIncidentsFromDB();
    }

    async function resolveIncident(id) {
      if (!confirm('Are you sure you want to delete this incident?')) return;
      try {
        await fetch(`/api/incidents?id=${encodeURIComponent(id)}`, { method: 'DELETE' });
        showToast('Incident Deleted', 'Fake or resolved incident removed from database.');
      } catch (err) {
        window.UrbanFlowData.deleteIncident(id);
        showToast('Removed Locally', 'Incident removed from active display.');
      }
      fetchIncidentsFromDB();
    }

    function openAddIncidentModal() {
      document.getElementById('addIncidentModal').classList.add('open');
    }

    function closeModals() {
      document.querySelectorAll('.modal-backdrop').forEach(m => m.classList.remove('open'));
    }

    function setupModalListeners() {
      document.getElementById('adminNewIncidentForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const type = document.getElementById('modalIncType').value;
        const road = document.getElementById('modalIncRoad').value.trim();
        const severity = document.getElementById('modalIncSeverity').value;
        const description = document.getElementById('modalIncDesc').value.trim();

        const payload = {
          title: `${type} at ${road}`,
          type,
          road,
          severity,
          description,
          reportedBy: 'Central Admin',
          status: 'Verified',
          delayImpact: severity === 'Critical' ? '+15 min delay' : '+6 min delay'
        };

        try {
          await fetch('/api/incidents', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          showToast('Saved to MongoDB', 'New incident added to DB.');
        } catch (err) {
          window.UrbanFlowData.addIncident(payload);
          showToast('Added to feed', 'Saved in local buffer.');
        }

        closeModals();
        document.getElementById('adminNewIncidentForm').reset();
        fetchIncidentsFromDB();
      });
    }

    function escapeHtml(str) {
      return (str || '').replace(/[&<>'"]/g,
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }
  </script>
</body>
</html>
